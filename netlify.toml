[build]
  publish = "exampleSite/public"
  command = "cd exampleSite && hugo --gc --minify -b $URL"

[build.environment]
  HUGO_VERSION = "0.128.2"

# Previews and branch deploys need to build against their own hostname so that
# canonical tags and social-card URLs point at the deploy being viewed.
[context.deploy-preview]
  command = "cd exampleSite && hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "cd exampleSite && hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Fingerprinted CSS/JS can be cached forever.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The directory used to live at /tools and search at /search; both are now the
# home page. Hugo also emits meta-refresh aliases, but a 301 is better.
[[redirects]]
  from = "/tools"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/search"
  to = "/"
  status = 301
  force = true
