<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand__mark" aria-hidden="true">SW</span>
      <span class="brand__text">
        <span>{{ site.Title }}</span>
        {{ with site.Params.region }}<span class="brand__sub">{{ . }}</span>{{ end }}
      </span>
    </a>

    <nav id="siteNav" class="site-nav" aria-label="Main">
      <ul class="nav">
        {{ range site.Menus.main }}
          {{ $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
          {{ if and $.IsHome (eq .URL "/") }}{{ $active = true }}{{ end }}
          <li><a class="nav__link" href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>

    <div class="header__actions">
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch color theme">
        <span class="theme-icon theme-icon--light">{{ partial "icon.html" "sun" }}</span>
        <span class="theme-icon theme-icon--dark">{{ partial "icon.html" "moon" }}</span>
      </button>
      <button id="navToggle" class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="siteNav" aria-label="Open menu">
        {{ partial "icon.html" "menu" }}
      </button>
    </div>
  </div>
</header>
